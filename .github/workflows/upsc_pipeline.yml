name: UPSC Analysis Pipeline

on:
  schedule:
    # Run twice an hour, staggered to avoid queue drops
    - cron: '20,50 * * * *'
  workflow_dispatch:          # Manual trigger

concurrency:
  group: upsc-pipeline
  cancel-in-progress: false

jobs:
  analyze_articles:
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-upsc-${{ hashFiles('**/requirements.txt') }}

      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-upsc-llama3.1
          restore-keys: |
            ${{ runner.os }}-huggingface-upsc-

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run UPSC Local LLM Pipeline
        env:
          SATYA_DB_URL: ${{ secrets.SATYA_DB_URL }}
          SATYA_DB_TOKEN: ${{ secrets.SATYA_DB_TOKEN }}
          SATYA_UPSC_DB_URL: ${{ secrets.SATYA_UPSC_DB_URL }}
          SATYA_UPSC_DB_TOKEN: ${{ secrets.SATYA_UPSC_DB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python upsc_pipeline.py
