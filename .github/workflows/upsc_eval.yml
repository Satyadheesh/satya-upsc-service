name: UPSC Eval

# Runs automatically when the prompt/model/eval set changes, or by hand.
# A passing run approves the prompt version; the pipeline only runs approved prompts.
on:
  push:
    branches: [main]
    paths: ['analyzer.py', 'syllabus.py', 'eval/**', '.github/workflows/upsc_eval.yml']
  workflow_dispatch:
    inputs:
      reuse_run:
        description: 'Skip the model and re-score the shard outputs of this earlier run id'
        required: false
        default: ''

concurrency:
  group: upsc-eval
  cancel-in-progress: true

env:
  SATYA_UPSC_DB_URL: ${{ secrets.SATYA_UPSC_DB_URL }}
  SATYA_UPSC_DB_TOKEN: ${{ secrets.SATYA_UPSC_DB_TOKEN }}
  UPSC_MODEL_FILE: Qwen2.5-7B-Instruct-Q4_K_M.gguf

jobs:
  eval:
    if: ${{ !github.event.inputs.reuse_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-upsc-${{ hashFiles('requirements.txt') }}
      - uses: actions/cache@v4
        with:
          path: models
          key: gguf-${{ env.UPSC_MODEL_FILE }}
      - run: pip install -r requirements.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - run: python eval/run_eval.py --shard ${{ matrix.shard }}/6 --out eval_out/${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.shard }}
          path: eval_out/${{ matrix.shard }}.json

  report:
    needs: eval
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          path: eval_out
          merge-multiple: true
          run-id: ${{ github.event.inputs.reuse_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Migrate schema (idempotent)
        shell: bash
        run: python migrate.py 2>&1 | tee migrate.log
      - name: Report and approve
        shell: bash
        run: python eval/report.py eval_out/*.json --approve --md eval_report.md 2>&1 | tee report.log
      # Publish the report + raw shard outputs on the eval-reports branch (readable without log access)
      - name: Publish report
        if: ${{ always() }}
        run: |
          mkdir -p /tmp/pub && cp -r eval_out /tmp/pub/ 2>/dev/null || true
          cp migrate.log report.log /tmp/pub/ 2>/dev/null || true
          cp eval_report.md /tmp/pub/ 2>/dev/null || echo "report did not render" > /tmp/pub/eval_report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin eval-reports || true
          git checkout -B eval-reports origin/eval-reports 2>/dev/null || git checkout --orphan eval-reports
          git rm -rq . 2>/dev/null || true
          D="runs/${{ github.run_id }}"; mkdir -p "$D"; cp -r /tmp/pub/* "$D"/; cp /tmp/pub/eval_report.md latest.md
          git add -A && git commit -qm "eval report run ${{ github.run_id }} (${GITHUB_SHA::7})" && git push -q origin eval-reports
