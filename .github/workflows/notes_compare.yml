name: UPSC notes compare (read-only)

# Writes notes with the analyzer.py of the chosen branch for real articles and shows them next to the stored
# notes, with what the grounding check dropped. Writes nothing to any DB. Result: eval-reports branch,
# runs/notes-<run id>/report.md (and the run's Summary tab).
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Article IDs (default: the 30 notes of the 3 Oct hand quality check)'
        default: '129424,123894,128055,128988,126658,125643,126727,129047,125715,127566,126779,127904,129358,129461,125256,127273,127587,123870,128552,128457,129054,127868,123462,128349,127829,127109,126637,126729,129363,127645'

concurrency:
  group: notes-compare-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
  PYTHONPATH: ${{ github.workspace }}/.ci
  SATYA_DB_URL: ${{ secrets.SATYA_DB_URL }}
  SATYA_DB_TOKEN: ${{ secrets.SATYA_DB_TOKEN }}
  SATYA_UPSC_DB_URL: ${{ secrets.SATYA_UPSC_DB_URL }}
  SATYA_UPSC_DB_TOKEN: ${{ secrets.SATYA_UPSC_DB_TOKEN }}
  UPSC_MODEL_REPO: unsloth/gemma-4-12b-it-GGUF
  UPSC_MODEL_FILE: gemma-4-12b-it-Q4_K_M.gguf

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-core
          token: ${{ secrets.CORE_TOKEN }}
      - name: Free disk for model weights
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-upsc-${{ hashFiles('requirements.txt') }}
      - uses: actions/cache@v4
        with:
          path: models
          key: gguf-${{ env.UPSC_MODEL_FILE }}
      - run: pip install -r requirements.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - run: python tools/notes_compare.py run --ids "${{ github.event.inputs.ids }}" --shard ${{ matrix.shard }}/6 --out out/${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: notes-${{ matrix.shard }}
          path: out/${{ matrix.shard }}.json

  report:
    needs: notes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-core
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: python tools/notes_compare.py report out/*.json --md report.md
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.run_id }}
        run: |
          set -e
          rm -rf /tmp/wt && mkdir /tmp/wt && cd /tmp/wt && git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${CORE_TOKEN}@github.com/${GITHUB_REPOSITORY}-core.git"
          if git fetch -q --depth 1 origin eval-reports; then git checkout -q -b eval-reports FETCH_HEAD; else git checkout -q --orphan eval-reports; fi
          mkdir -p "runs/notes-$RUN" && cp "$GITHUB_WORKSPACE"/report.md "$GITHUB_WORKSPACE"/out/*.json "runs/notes-$RUN"/
          git add -A && git commit -qm "notes compare $RUN (${GITHUB_SHA::7})" && git push -q origin HEAD:eval-reports
